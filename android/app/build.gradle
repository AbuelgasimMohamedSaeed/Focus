plugins {
    id 'com.android.application'
}

// Each build on GitHub gets the next number, so the app can tell when a newer one is out.
def build = (System.getenv('FOCUS_BUILD') ?: '1') as int

android {
    namespace 'io.github.abuelgasimmohamedsaeed.focus'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.abuelgasimmohamedsaeed.focus'
        minSdk 30
        targetSdk 35
        versionCode build
        versionName "1.0.$build"
    }

    // Updates only install over the app when they carry the same signature, so every build uses this key.
    // The key and its password are private GitHub secrets (FOCUS_KEYSTORE, FOCUS_KEY_PASSWORD), never in the code.
    signingConfigs {
        release {
            storeFile file('../focus.keystore')
            storePassword System.getenv('FOCUS_KEY_PASSWORD')
            keyAlias 'focus'
            keyPassword System.getenv('FOCUS_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
