# Builds the Android app whenever its code changes and publishes it as a GitHub release.
# Installed apps see the new release and offer the update.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack the signing key
        env:
          FOCUS_KEYSTORE: ${{ secrets.FOCUS_KEYSTORE }}
          FOCUS_KEY_PASSWORD: ${{ secrets.FOCUS_KEY_PASSWORD }}
        run: |
          if [ -z "$FOCUS_KEYSTORE" ] || [ -z "$FOCUS_KEY_PASSWORD" ]; then
            echo "::error::Add the FOCUS_KEYSTORE and FOCUS_KEY_PASSWORD secrets (Settings > Secrets and variables > Actions)." | tee build.log
            exit 1
          fi
          echo "$FOCUS_KEYSTORE" | tr -d ' \r\n' | base64 -d > android/focus.keystore

      - name: Build
        working-directory: android
        env:
          FOCUS_BUILD: ${{ github.run_number }}
          FOCUS_KEY_PASSWORD: ${{ secrets.FOCUS_KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain assembleRelease 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Focus.apk
          gh release create "app-v$N" Focus.apk \
            --title "Focus for Android 1.0.$N" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest

      - name: Report a failed build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          { echo '```'; grep -E "error|Error|FAILED|What went wrong|e: |warning: \[" -A3 build.log | head -c 60000; echo '```'; } > report.md
          gh release create "build-failed-$N" --draft --title "Build $N failed" --notes-file report.md || true
